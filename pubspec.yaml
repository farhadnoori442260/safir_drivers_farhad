name: safir_drivers
description: "Safir Drivers Application - Internet Taxi Service"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # پکیج مدیریت چندزبانه و ترجمه
  easy_localization: ^3.0.7

  # سیستم چندزبانه داخلی فلاتر
  flutter_localizations:
    sdk: flutter
  audioplayers: ^6.0.0  

  # نقشه و محاسبات جغرافیایی
  maplibre_gl: ^0.26.2
  latlong2: ^0.9.1

  geolocator: ^12.0.0
  connectivity_plus: ^6.0.4

  # فایربیس
  firebase_core: ^3.3.0
  firebase_auth: ^5.1.2
  cloud_firestore: ^5.1.0
  firebase_database: ^11.0.3
  firebase_storage: ^12.1.2
  firebase_messaging: ^15.0.3

  permission_handler: ^11.3.1
  image_picker: ^1.1.2
  image_cropper: ^8.0.0
  
  # پکیج Geofire
  flutter_geofire: ^2.0.7

  # اعلان‌ها و نوتیفیکیشن
  flutter_notification_channel: ^3.1.0
  
  http: ^1.2.2
  url_launcher: ^6.3.0
  cupertino_icons: ^1.0.6
  restart_app: ^1.2.1
  country_picker: ^2.0.24
  
  rounded_loading_button_plus: ^3.0.1
  
  google_sign_in: ^6.2.1
  provider: ^6.1.2
  pinput: ^5.0.0
  path_provider: ^2.1.3
  cached_network_image: ^3.3.1
  shared_preferences: ^2.2.3

  # گوینده صوتی (TTS)
  flutter_tts: ^4.0.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/translations/
    - assets/map/style.json
    - assets/audio/fa/
